# Tier 3 — red-team verification matrix.
#
# Two legs, because a container shares the runner's kernel (good for distro userspace + the uid
# boundary) but cannot set the console-hardening sysctls (those need a VM with its own kernel).
#
#   container-leg : arena bootstrap + selfcheck across distro userspaces (fast; uid/protocol/fixes)
#   vm-leg        : the hardening GATE tests inside a KVM VM across sysctl states
#
# Manual / scheduled, not on every push (it provisions VMs).
name: redteam-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly

jobs:
  container-leg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:24.04", "debian:12", "fedora:41", "archlinux:latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Arena bootstrap + selfcheck on ${{ matrix.distro }}
        run: |
          docker build -f redteam/2026-10-19/tiers/container/Dockerfile \
            --build-arg DISTRO=${{ matrix.distro }} -t envh-arena-${{ strategy.job-index }} .
          docker run --rm --privileged envh-arena-${{ strategy.job-index }}
      - name: Record environment fingerprint
        if: always()
        run: echo "distro=${{ matrix.distro }} kernel(shared)=$(uname -r)"

  vm-leg:
    # KVM-capable runner required (nested virt). On GitHub-hosted runners use a nested-virt action
    # or a self-hosted KVM runner; the gate tests need a guest kernel we control.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        box: ["generic/ubuntu2404", "generic/debian12", "generic/fedora40"]
    steps:
      - uses: actions/checkout@v4
      - name: Hardening gate tests in a VM (${{ matrix.box }})
        run: |
          echo "Provision a VM ($ARENA_VM_BOX) and run the gate tests:"
          echo "  cd redteam/2026-10-19/tiers/vm && ARENA_VM_BOX='${{ matrix.box }}' vagrant up"
          echo "  vagrant ssh -c 'sudo bash /vagrant/redteam/2026-10-19/tiers/vm/gate_tests.sh'"
          echo "Requires a KVM/libvirt or nested-virt runner; see tiers/README.md. Marked expected-manual here."
        env:
          ARENA_VM_BOX: ${{ matrix.box }}
