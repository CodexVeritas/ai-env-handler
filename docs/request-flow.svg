<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How an envh request flows</title>
<desc>A session approval and a run, with the two trust zones: processes running as you, and the envh service user whose console approves.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="830" fill="#FFFFFF"/>
<rect x="12" y="14" width="238" height="794" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="131" y="34" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">runs as you (uid 1000)</text>
<text x="131" y="49" text-anchor="middle" font-size="12" fill="#993C1D">cannot reach vault or console</text>
<rect x="300" y="14" width="368" height="794" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="484" y="34" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">runs as user envh</text>
<text x="484" y="49" text-anchor="middle" font-size="12" fill="#0F6E56">files 0600, memory unreadable</text>
<text x="275" y="30" text-anchor="middle" font-size="12" fill="#5F5E5A">kernel</text><text x="275" y="44" text-anchor="middle" font-size="12" fill="#5F5E5A">boundary</text>
<g stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="3 3"><line x1="70" y1="102" x2="70" y2="800"/><line x1="190" y1="102" x2="190" y2="800"/><line x1="360" y1="102" x2="360" y2="800"/><line x1="490" y1="102" x2="490" y2="800"/><line x1="610" y1="102" x2="610" y2="800"/></g>
<g fill="#FFFFFF" stroke="#888780" stroke-width="0.8"><rect x="15" y="58" width="110" height="44" rx="4"/><rect x="135" y="58" width="110" height="44" rx="4"/><rect x="305" y="58" width="110" height="44" rx="4"/><rect x="435" y="58" width="110" height="44" rx="4"/><rect x="555" y="58" width="110" height="44" rx="4"/></g>
<g text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="500"><text x="70" y="76">you</text><text x="190" y="76">envh command</text><text x="360" y="76">broker</text><text x="490" y="76">console</text><text x="610" y="76">you at console</text></g>
<g text-anchor="middle" fill="#5F5E5A" font-size="12"><text x="70" y="92">or an agent</text><text x="190" y="92">what you type</text><text x="360" y="92">envh serve</text><text x="490" y="92">its own window</text><text x="610" y="92">keyboard only</text></g>
<g stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)">
<line x1="70" y1="124" x2="188" y2="124"/>
<line x1="190" y1="158" x2="358" y2="158"/>
<line x1="360" y1="236" x2="488" y2="236"/>
<line x1="490" y1="270" x2="608" y2="270"/>
<line x1="610" y1="304" x2="492" y2="304"/>
<line x1="490" y1="338" x2="362" y2="338"/>
<line x1="360" y1="414" x2="192" y2="414" stroke-dasharray="4 3"/>
<line x1="190" y1="448" x2="72" y2="448" stroke-dasharray="4 3"/>
<line x1="70" y1="494" x2="188" y2="494"/>
<line x1="190" y1="528" x2="358" y2="528"/>
<line x1="360" y1="606" x2="192" y2="606" stroke-dasharray="4 3"/>
<line x1="190" y1="640" x2="72" y2="640"/>
<line x1="190" y1="740" x2="358" y2="740"/>
</g>
<g text-anchor="middle" fill="#2C2C2A" font-size="12">
<text x="130" y="118">1 envh session start</text>
<text x="275" y="152">2 request via Unix socket</text>
<text x="425" y="230">3 prompt + code</text>
<text x="550" y="264">4 shows reason, code</text>
<text x="550" y="298">5 you type the code</text>
<text x="425" y="332">6 decision</text>
<text x="275" y="408">7 session id, expiry</text>
<text x="130" y="442">8 approved, expires</text>
<text x="130" y="488">9 envh run --session</text>
<text x="275" y="522">10 run with session id</text>
<text x="275" y="600">11 values, once</text>
<text x="130" y="634">12 starts your script</text>
<text x="275" y="734">13 run_done, exit code</text>
</g>
<g fill="#F1EFE8" stroke="#888780" stroke-width="0.8"><rect x="305" y="184" width="110" height="22" rx="4"/><rect x="305" y="362" width="110" height="22" rx="4"/><rect x="305" y="554" width="110" height="22" rx="4"/><rect x="305" y="764" width="110" height="22" rx="4"/><rect x="20" y="660" width="220" height="54" rx="4"/></g>
<g text-anchor="middle" fill="#444441" font-size="12">
<text x="360" y="199">reads policy, caps</text>
<text x="360" y="377">writes audit log</text>
<text x="360" y="569">checks the session</text>
<text x="360" y="779">writes audit log</text>
<text x="130" y="676">values visible only to the script</text>
<text x="130" y="691">and what it starts, while it runs;</text>
<text x="130" y="706">leftovers are terminated at exit</text>
</g>
</svg>
