[project]
name = "envh"
version = "0.1.0"
description = "Human-approved secrets for scripts and Claude Code agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "pyrage>=1.1",
    "pyyaml>=6.0",
]

[project.scripts]
envh = "envh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envh"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
